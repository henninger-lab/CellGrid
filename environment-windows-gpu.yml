# Windows x86-64 environment for CellGrid with NVIDIA CUDA acceleration.
# Requires a current NVIDIA driver compatible with CUDA 12.6.
name: cellgrid-win-gpu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - matplotlib
  - scikit-image
  - scipy
  - tifffile
  - aicspylibczi
  - napari
  - streamlit
  - numba
  - palettable
  - reportlab
  - pip
  - pip:
      # Keep this matched CUDA pair together. The extra index supplies the
      # CUDA-enabled wheels while PyPI supplies Cellpose and its dependencies.
      - --extra-index-url=https://download.pytorch.org/whl/cu126
      - torch==2.7.1+cu126
      - torchvision==0.22.1+cu126
      - cellpose==4.2.1.1
